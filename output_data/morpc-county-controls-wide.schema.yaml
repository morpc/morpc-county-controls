fields:
  - name: vintage_period
    type: integer
    description: 'Unique identifier for the geography'
  - name: vintage_period_freq
    type: string
    description: 'Frequency descriptor and anchor for the vintage period. Y-DEC refers to a calendar year (i.e. a year ending in December)'
