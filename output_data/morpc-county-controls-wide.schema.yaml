    type: string
    description: 'Name of the geography for which the projection applies'
  - name: reference_period
    type: integer
    description: 'Year for which the projection applies. Projection is referenced to July 1 of the indicated year.'
  - name: reference_period_freq
    type: string
    description: 'Frequency descriptor and anchor for the reference period. Y-JUN refers to a year ending in June.'
